map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- HTTP to HTTPS Redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name quixpos.com;
    return 301 https://$host$request_uri;
}

# --- HTTPS Main Server ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name quixpos.com;

    # --- SSL / TLS Certificates ---
    ssl_certificate     /etc/letsencrypt/live/quixpos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quixpos.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # --- Header Buffer Limits (prevents HTTP/2 RST_STREAM / ERR_HTTP2_PROTOCOL_ERROR) ---
    large_client_header_buffers 4 128k;

    # --- Static File Root ---
    root /home/ubuntu/src/quixpos_com/dist;
    index index.html;

    # --- Request Body & Uploads (PDF receipts, AVIF photos) ---
    client_max_body_size 100m;
    client_body_timeout 300s;

    # --- Compression (Gzip) ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/manifest+json
        application/wasm
        image/svg+xml;

    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # --- OIDC / OAuth 2.0 Discovery & JWKS ---
    location /.well-known/ {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Backend API Proxy ---
    location /api/ {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cookie_path / /;

        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # --- Hashed Static Assets (Vite) ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- SPA Entry Point (No Cache + COOP for Google Auth Popups) ---
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    # --- Static Files / SPA Fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
